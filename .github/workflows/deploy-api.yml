name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'WebAppClients.Api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

env:
  PROJECT_PATH: WebAppClients.Api/WebAppClients.Api.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish
  # TODO: replace with the App Service name you create in Azure.
  AZURE_WEBAPP_NAME: webappclients-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Publish
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          --configuration Release
          --no-restore
          --output "${{ env.PUBLISH_DIR }}"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}

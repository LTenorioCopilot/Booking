name: Build and Pack NuGet

on:
  push:
    paths:
      - 'WebAppClients.Api/**'
      - '.github/workflows/build-nuget.yml'

permissions:
  contents: read
  packages: write

env:
  PROJECT_PATH: WebAppClients.Api/WebAppClients.Api.csproj
  PACKAGE_OUTPUT: ${{ github.workspace }}/nupkg

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Pack
        run: >
          dotnet pack ${{ env.PROJECT_PATH }}
          --configuration Release
          --no-build
          --output ${{ env.PACKAGE_OUTPUT }}
          -p:PackageVersion=1.0.0-ci.${{ github.run_number }}

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ${{ env.PACKAGE_OUTPUT }}/*.nupkg

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push ${{ env.PACKAGE_OUTPUT }}/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

name: Build and Package NuGet

on:
  push:
    branches:
      - main
    paths:
      - 'WebAppClients.Api/**'
      - '.github/workflows/build-nuget.yml'

env:
  PROJECT_PATH: WebAppClients.Api/WebAppClients.Api.csproj
  PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/output
  PACKAGE_VERSION: 1.0.${{ github.run_number }}

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Pack NuGet package
        run: >
          dotnet pack "${{ env.PROJECT_PATH }}"
          --configuration Release
          --no-build
          --output "${{ env.PACKAGE_OUTPUT_DIR }}"
          -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ env.PACKAGE_VERSION }}
          path: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg

      - name: Add GitHub Packages source
        run: >
          dotnet nuget add source
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --name github
          --username ${{ github.actor }}
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Push package to GitHub Packages
        run: >
          dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg"
          --source github
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
